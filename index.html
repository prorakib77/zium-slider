<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zium Slider - Demo Showcase</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 50px;
      opacity: 0.95;
    }

    .demo-links {
      display: grid;
      gap: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .demo-link {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 30px;
      text-decoration: none;
      color: white;
      transition: all 0.3s ease;
      display: block;
    }

    .demo-link:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .demo-link h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .demo-link .description {
      font-size: 1rem;
      opacity: 0.9;
    }

    .github-link {
      margin-top: 40px;
      display: inline-block;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .github-link:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎠 Zium Slider</h1>
    <p>Complete Slider Package with Themes & Presets</p>
    
    <div class="demo-links">
      <a href="demo.html" class="demo-link">
        <h2>Theme Showcase</h2>
        <div class="description">View all 6 beautiful themes (Classic, Modern, Minimal, Elegant, Bold, Vintage)</div>
      </a>
      
      <a href="demo-all-sliders.html" class="demo-link">
        <h2>All Slider Types</h2>
        <div class="description">Product Cards, Hero, Fashion, E-commerce, Swiper & Slick sliders</div>
      </a>
    </div>

    <a href="https://github.com/prorakib77/zium-slider" class="github-link" target="_blank">
      View on GitHub →
    </a>
  </div>
</body>
</html>
